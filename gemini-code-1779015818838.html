    object-fit: contain;
    display: block;
  }

    content: ''; position: absolute;

    width: 18px; height: 2.5px; background: #fff; border-radius: 2px;
  }

    position: fixed; right: 10px; z-index: 30;

    display: flex; flex-direction: column; align-items: center; gap: 22px;
    pointer-events: none;

  .alabel { font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  #avatar-circle {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);

  #follow-plus {
    width: 20px; height: 20px; background: #fe2c55; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-top: -10px; position: relative; z-index: 1;
    font-size: 14px; font-weight: 700; color: #fff; line-height: 1;
  }

  #disc {
    width: 40px; height: 40px; border-radius: 50%;
    border: 8px solid #444; background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    animation: spin 4s linear infinite;
  }
  #disc-inner { width: 10px; height: 10px; border-radius: 50%; background: #555; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bottom info */
  #info {
    position: fixed; bottom: 0; left: 0; right: 66px; z-index: 30;
    padding: 60px 14px calc(max(env(safe-area-inset-bottom, 0px), 12px) + 62px);
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    pointer-events: none;
  }

    text-shadow: 0 1px 5px rgba(0,0,0,0.6);

    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;

    text-shadow: 0 1px 3px rgba(0,0,0,0.6);

    font-size: 13px; font-weight: 600; color: #fff;
    margin-bottom: 10px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);

    font-size: 12px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;

    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-around;
    padding-top: 10px;

  .nav-icon svg { width: 25px; height: 25px; display: block; }
  .nav-lbl { font-size: 9px; font-weight: 500; color: rgba(255,255,255,0.45); letter-spacing: 0.02em; }

    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 8px;
    width: 44px; height: 28px; position: relative;
  }
  .plus-pill::before {
    content: ''; position: absolute; left: -5px; top: 0; bottom: 0;
    width: 8px; border-radius: 4px 0 0 4px; background: #69c9d0;
  }
  .plus-pill::after {
    content: ''; position: absolute; right: -5px; top: 0; bottom: 0;
    width: 8px; border-radius: 0 4px 4px 0; background: #ee1d52;
  }
  .plus-pill span { font-size: 18px; font-weight: 700; color: #000; z-index: 1; }

  #boot {
    position: fixed; inset: 0; z-index: 100;
    background: #000;

    transition: opacity 0.4s;

  .spinner {

  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function randomMeta() {
  return {
    name: pick(NAMES), verified: Math.random() < 0.33,
    caption: pick(CAPTIONS), tags: pick(TAGS),
    sound: pick(SOUNDS), color: pick(COLORS),
    likes: ri(1200, 890000), comments: ri(80, 32000),
    saves: ri(200, 58000), shares: ri(30, 14000)
  };
}

function applyMeta(m) {
  document.getElementById('uname').textContent = '@' + m.name;
  document.getElementById('verified-badge').style.display = m.verified ? 'inline-flex' : 'none';
  document.getElementById('caption-text').textContent = m.caption;
  document.getElementById('hashtag-text').textContent = m.tags.join(' ');
  document.getElementById('sound-text').textContent = m.sound;
  document.getElementById('like-count').textContent = fmt(m.likes);
  document.getElementById('comment-count').textContent = fmt(m.comments);
  document.getElementById('save-count').textContent = fmt(m.saves);
  document.getElementById('share-count').textContent = fmt(m.shares);
  const av = document.getElementById('avatar-circle');
  av.style.background = m.color;
  av.textContent = m.name[0].toUpperCase();
}

// ── Optimized Player ──────────────────────────────────────────────────────────
const H     = window.innerHeight;
const stage = document.getElementById('stage');
const slotA = document.getElementById('slot-a');
const slotB = document.getElementById('slot-b');
const vidA  = document.getElementById('vid-a');
const vidB  = document.getElementById('vid-b');
const boot  = document.getElementById('boot');
const hint  = document.getElementById('unmute-hint');

slotA.style.height = H + 'px';
slotB.style.height = H + 'px';
slotB.style.top    = H + 'px';

let queue       = shuffle(VIDEO_URLS);
let queueIdx    = 0;   
let isAnimating = false;
let isMuted     = true; 

let cur = vidA;
let nxt = vidB;

// Hardened fallback system: 20 phones hammering a network means delays.
// Lowered timeout from 8s to 2.5s. If it isn't ready, we force play anyway to avoid freezes.
function waitReady(video) {
  return new Promise(resolve => {
    if (video.readyState >= 2) { resolve(); return; } // HAVE_CURRENT_DATA is enough to play safely
    const done = () => { clearTimeout(t); resolve(); };
    const t = setTimeout(done, 2500); 
    video.addEventListener('loadeddata', done, { once: true });
  });
}

function loadVideo(video, url) {
  // Completely stopped using removeAttribute('src') memory dumps, which forced redundant data re-downloads.
  if (video.src === url) return; 
  video.src = url;
  video.muted = true; 
  video.load();
}

function playVideo(video) {
  video.muted = isMuted;
  const playPromise = video.play();
  if (playPromise !== undefined) {
    playPromise.catch(error => {
      // Direct failover management for mobile audio track drops
      console.log("Play interrupted or blocked: auto-muting fallback.");
      video.muted = true;
      video.play().catch(() => {});
    });
  }
}

async function advance() {
  if (isAnimating) return;
  isAnimating = true;

  await waitReady(nxt);

  stage.style.transition = 'transform 0.35s cubic-bezier(0.32, 0, 0.18, 1)';
  stage.style.transform  = `translateY(${-H}px)`;

  let settled = false;
  const onSettle = () => {
    if (settled) return;
    settled = true;

    cur.pause();

    // Swapping logical identities
    [cur, nxt] = [nxt, cur];

    cur.parentElement.style.top = '0px';
    nxt.parentElement.style.top = H + 'px';

    stage.style.transition = 'none';
    stage.style.transform  = 'translateY(0)';

    playVideo(cur);
    applyMeta(randomMeta());

    queueIdx = (queueIdx + 1) % queue.length;
    
    // Aggressive early caching: Starts downloading the next file immediately 
    // giving it maximum time to slide down the pipeline.
    loadVideo(nxt, queue[(queueIdx + 1) % queue.length]);

    isAnimating = false;
  };

  stage.addEventListener('transitionend', onSettle, { once: true });
  setTimeout(onSettle, 450); 
}

// Fixed native loop glitches causing audio failure on phone rotation/wake
function onVideoEnded() { 
  advance(); 
}
vidA.addEventListener('ended', onVideoEnded);
vidB.addEventListener('ended', onVideoEnded);

stage.addEventListener('click', () => {
  if (isMuted) {
    isMuted = false;
    cur.muted = false;
    // Extra insurance to keep video track audio playing natively
    playVideo(cur);
    hint.classList.remove('show');
  } else {
    advance();
  }
});

hint.addEventListener('click', e => {
  e.stopPropagation();
  isMuted = false;
  cur.muted = false;
  playVideo(cur);
  hint.classList.remove('show');
});

async function init() {
  loadVideo(cur, queue[0]);
  loadVideo(nxt, queue[1] ?? queue[0]);

  await waitReady(cur);

  boot.classList.add('hidden');
  playVideo(cur);
  applyMeta(randomMeta());

  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 5000);
}

init();
</script>
</body>
